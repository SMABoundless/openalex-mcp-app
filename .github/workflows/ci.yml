name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is what package.json and Render use; 24 is the current release
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The offline suites: unit tests, and end-to-end tests with OpenAlex replaced
      # by canned replies. The live suite (npm run test:live) calls the real API,
      # needs a key and costs money, so it is run by hand before a release.
      - run: npm test
      # Type-checks the views against the server's output types, then builds everything
      - run: npm run build
