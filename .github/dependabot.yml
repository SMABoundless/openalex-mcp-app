# Proposes dependency updates as pull requests; never merges them.
# Minor and patch updates are grouped into one pull request a week. Major
# updates arrive separately: the MCP SDK and ext-apps majors in particular
# need a test in Claude Desktop before merging, because the automated checks
# cannot exercise the sandboxed frame the views run in.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
