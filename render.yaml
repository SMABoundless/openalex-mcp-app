services:
  - type: web
    name: openalex-mcp-app
    runtime: node
    plan: free
    nodeVersion: "22.23.5"
    buildCommand: npm install && npm run build
    startCommand: node dist/server/index.js
    envVars:
      - key: PORT
        value: "3000"
      - key: TRANSPORT
        value: http
      - key: OPENALEX_API_KEY
        sync: false
